{{ define "editor.html" }}{{ template "head" . }}
<section class="editor-page">
  <p class="eyebrow"><a href="/admin/posts">Posts</a></p>
  <h1>{{ if .IsNew }}New post{{ else }}Edit post{{ end }}</h1>
  {{ if .Error }}<p class="error">{{ .Error }}</p>{{ end }}
  <form method="post" id="post-form">
    <input type="hidden" name="csrf" value="{{ .CSRF }}">
    <label>Title <input name="title" value="{{ .Post.Title }}" required autofocus></label>
    <label>Slug <input name="slug" value="{{ .Post.Slug }}" placeholder="generated-from-title"></label>
    <label>Summary <textarea name="summary" rows="2">{{ .Post.Summary }}</textarea></label>
    <label>Tags <input name="tags" value="{{ .Tags }}" placeholder="go, web, notes"></label>
    <label>Body</label>
    <div class="toolbar" role="toolbar">
      <button type="button" data-command="bold"><strong>B</strong></button>
      <button type="button" data-command="italic"><em>I</em></button>
      <button type="button" data-command="formatBlock" data-value="h2">H2</button>
      <button type="button" data-command="insertUnorderedList">List</button>
      <button type="button" data-command="formatBlock" data-value="pre">Code</button>
      <button type="button" data-command="createLink">Link</button>
    </div>
    <div id="editor" class="editor" contenteditable="true">{{ .Post.BodyHTML }}</div>
    <textarea name="body_html" id="body-html" hidden></textarea>
    <label>Status
      <select name="status"><option value="draft">Draft</option><option value="published">Published</option></select>
    </label>
    <label>Publish at <input type="datetime-local" name="published_at" value="{{ .Post.PublishedAt }}"></label>
    <button type="submit">Save post</button>
  </form>
  {{ if not .IsNew }}
    <div class="editor-actions">
      <a href="/admin/posts/{{ .Post.ID }}/preview">Preview</a>
      <form method="post" action="/admin/posts/{{ .Post.ID }}/publish"><input type="hidden" name="csrf" value="{{ .CSRF }}"><button type="submit">Publish now</button></form>
      <form method="post" action="/admin/posts/{{ .Post.ID }}/unpublish"><input type="hidden" name="csrf" value="{{ .CSRF }}"><button type="submit">Unpublish</button></form>
      <form method="post" action="/admin/posts/{{ .Post.ID }}/delete"><input type="hidden" name="csrf" value="{{ .CSRF }}"><button type="submit">Delete</button></form>
    </div>
  {{ end }}
</section>
<script src="/static/editor.js" defer></script>
{{ template "foot" . }}{{ end }}
