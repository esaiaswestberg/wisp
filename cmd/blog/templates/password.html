{{ define "password.html" }}{{ template "head" . }}
<section class="form-page narrow">
  <p class="eyebrow"><a href="/admin">Admin</a></p>
  <h1>Change password</h1>
  {{ if .Error }}<p class="error">{{ .Error }}</p>{{ end }}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ .CSRF }}">
    <label>Current password <input type="password" name="current_password" required></label>
    <label>New password <input type="password" name="new_password" minlength="12" required></label>
    <label>Confirm new password <input type="password" name="new_password_confirm" minlength="12" required></label>
    <button type="submit">Change password</button>
  </form>
</section>
{{ template "foot" . }}{{ end }}
