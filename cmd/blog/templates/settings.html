{{ define "settings.html" }}{{ template "head" . }}
<section class="form-page">
  <p class="eyebrow"><a href="/admin">Admin</a></p>
  <h1>Site settings</h1>
  {{ if .Error }}<p class="error">{{ .Error }}</p>{{ end }}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ .CSRF }}">
    <label>Site name <input name="site_name" value="{{ index .Form "site_name" }}" required></label>
    <label>Description <input name="site_description" value="{{ index .Form "site_description" }}"></label>
    <label>Language <input name="language" value="{{ index .Form "language" }}" required></label>
    <label>Base URL <input type="url" name="base_url" value="{{ index .Form "base_url" }}" required></label>
    <button type="submit">Save settings</button>
  </form>
</section>
{{ template "foot" . }}{{ end }}
