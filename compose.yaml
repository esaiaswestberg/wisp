services:
  wisp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BLOG_LISTEN: :8080
      BLOG_DATA_DIR: /data
    volumes:
      - wisp-data:/data
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - wisp
    ports:
      - "80:80"
      - "443:443"
    environment:
      BLOG_DOMAIN: ${BLOG_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  wisp-data:
  caddy-data:
  caddy-config:
